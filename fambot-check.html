<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FamBot check | Sponsor Sorter</title></head>
<body><main><h1>FamBot check</h1><p>This check uses the signed-in account and the fixed sample below. It does not save a profile, create an offer or send a message.</p><blockquote id="sample">We help creators and brands plan clear, respectful sponsorship campaigns.</blockquote><button id="check" type="button">Check sample text</button><p id="status" role="status">Sign in to Sponsor Sorter before running this check.</p></main>
<script type="module">
import { famBotModerateWithModal } from './js/FamBot.js?v=20261018-fambot1';
const button = document.getElementById('check');
const status = document.getElementById('status');
button.addEventListener('click', async () => {
  if (button.disabled) return;
  button.disabled = true;
  status.textContent = 'Checking the sample…';
  try {
    const result = await famBotModerateWithModal({ content: document.getElementById('sample').textContent, type: 'profile' });
    status.textContent = result.allowed
      ? `FamBot allowed the check. Reference: ${result.check_id}. No profile, offer or message was submitted.`
      : 'The check was not approved. No profile, offer or message was submitted.';
  } finally { button.disabled = false; }
});
</script></body></html>
