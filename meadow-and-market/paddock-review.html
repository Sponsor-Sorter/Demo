<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meadow Markets paddock artwork review</title><link rel="stylesheet" href="rotations.css?v=5"><style>body{margin:0;background:#f3eedb;color:#583d24;font:15px system-ui}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}article{min-width:0}h2{font-size:14px;margin:2px}.scene{height:230px;position:relative;background:#94ac60;border-radius:8px;overflow:hidden;background-image:url(assets/generated/willowbrook-meadow-map.webp);background-size:250%;background-position:57% 68%}.object{position:absolute;left:10%;top:30%;width:80%;height:60%}.ground-guide{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:6;pointer-events:none}.ground-guide polygon{fill:none;stroke:#e8ffff;stroke-width:4;stroke-dasharray:10 6}input{width:22px;height:22px}@media(max-width:1100px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.scene{height:200px}}</style><header><h1>Paddock progression · four physical views</h1><label><input type="checkbox" id="guides">Show occupied tile boundary</label><label><input type="checkbox" id="animals" checked>Show residents</label></header><main></main><script src="rotations.js?v=5"></script><script src="directional-yards.js?v=2"></script><script src="rotation-assets.js?v=4"></script><script src="paddock-art-data.js?v=1"></script><script src="paddock-art.js?v=1"></script><script>
function draw(){const R=window.meadowRotations;document.querySelector('main').innerHTML=[0,1,2,3].map(tier=>[0,1,2,3].map(rotation=>{const o={id:'review-'+tier+'-'+rotation,type:'paddock',tier,rotation},[w,h]=window.meadowYards.baseSize(o),fp=R.rotatedFootprint({w,h},rotation),l=fp.h/(fp.w+fp.h)*1000,r=fp.w/(fp.w+fp.h)*1000,art=R.art(o,fp,{residents:document.querySelector('#animals').checked?[{type:'cow',breedTier:0},{type:'sheep',breedTier:0}]:[]});return '<article><h2>Level '+(tier+1)+' · '+(rotation*90)+'° · '+fp.w+'×'+fp.h+' tiles</h2><div class="scene"><div class="object">'+art+(document.querySelector('#guides').checked?'<svg class="ground-guide" viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon points="'+l+',0 1000,'+r+' '+r+',1000 0,'+l+'"/></svg>':'')+'</div></div></article>'}).join('')).join('')}document.querySelectorAll('input').forEach(el=>el.onchange=draw);draw();
</script></html>
