<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meadow Markets coop artwork review</title><link rel="stylesheet" href="rotations.css?v=6"><style>body{margin:0;background:#f3eedb;color:#583d24;font:15px system-ui}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}article{min-width:0}h2{font-size:14px;margin:2px}.scene{height:320px;position:relative;background:#94ac60;border-radius:10px;overflow:hidden;background-image:url(assets/generated/willowbrook-meadow-map.webp);background-size:250%;background-position:57% 68%}.object{position:absolute}.ground-guide{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:9;pointer-events:none}.ground-guide polygon{fill:none;stroke:#fff9e0;stroke-width:4;stroke-dasharray:10 6}input{width:22px;height:22px}@media(max-width:1100px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){main{grid-template-columns:1fr}}</style><header><h1>Chicken coops · four upgrades · four views</h1><label><input type="checkbox" id="guides" checked>Occupied tiles</label><label><input type="checkbox" id="animals" checked>Live hens</label><label><input type="checkbox" id="fixed">Same tile scale</label></header><main></main><script src="rotations.js?v=6"></script><script src="directional-yards.js?v=2"></script><script src="rotation-assets.js?v=4"></script><script src="paddock-art-data.js?v=1"></script><script src="paddock-art.js?v=2"></script><script src="coop-art-data.js?v=1"></script><script src="coop-art.js?v=1"></script><script>
function draw(){const R=window.meadowRotations,main=document.querySelector('main');main.innerHTML=[0,1,2,3].map(tier=>[0,1,2,3].map(rotation=>{const o={id:'review-'+tier+'-'+rotation,type:'coop',tier,rotation},[w,h]=window.meadowYards.baseSize(o),fp=R.rotatedFootprint({w,h},rotation),l=fp.h/(fp.w+fp.h)*1000,r=fp.w/(fp.w+fp.h)*1000,art=R.art(o,fp,{residents:document.querySelector('#animals').checked?Array.from({length:[1,2,4,8][tier]},()=>({type:'chicken',breedTier:0})):[]});return '<article data-tier="'+tier+'" data-rotation="'+rotation+'"><h2>Level '+(tier+1)+' · '+rotation*90+'° · '+fp.w+'×'+fp.h+' tiles · '+[1,2,4,8][tier]+' hens</h2><div class="scene"><div class="object">'+art+(document.querySelector('#guides').checked?'<svg class="ground-guide" viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon points="'+l+',0 1000,'+r+' '+r+',1000 0,'+l+'"/></svg>':'')+'</div></div></article>'}).join('')).join('');for(const article of main.children){const o={type:'coop',tier:+article.dataset.tier,rotation:+article.dataset.rotation},[w,h]=window.meadowYards.baseSize(o),fp=R.rotatedFootprint({w,h},o.rotation),frame=R.frame(o),p=R.projection(frame,fp),ys=Object.values(p).flatMap(m=>[m[5],m[1]*frame.width+m[5],m[3]*frame.height+m[5],m[1]*frame.width+m[3]*frame.height+m[5]]),min=Math.min(...ys),range=(Math.max(...ys)-min)/1000,scene=article.querySelector('.scene'),object=article.querySelector('.object'),ratio=1.864,height=document.querySelector('#fixed').checked?32*(w+h)/ratio:Math.min(scene.clientWidth*.9/ratio,296/range),width=height*ratio;Object.assign(object.style,{width:width+'px',height:height+'px',left:(scene.clientWidth-width)/2+'px',top:(320-height*range)/2-height*min/1000+'px'})}}
document.querySelectorAll('input').forEach(el=>el.onchange=draw);window.addEventListener('resize',draw);draw();
</script></html>
