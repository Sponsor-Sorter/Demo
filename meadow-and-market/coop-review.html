<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meadow Markets coop grid review</title><link rel="stylesheet" href="rotations.css?v=7"><style>
body{margin:0;background:#f3eedb;color:#583d24;font:15px system-ui}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}article{min-width:0}h2{font-size:13px;margin:2px}.scene{height:350px;position:relative;background:#94ac60;border-radius:10px;overflow:hidden;background-image:url(assets/generated/willowbrook-meadow-map.webp);background-size:250%;background-position:57% 68%}.object{position:absolute}.ground-guide{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:9;pointer-events:none}.ground-guide polygon{fill:none;stroke:#53e5ff;stroke-width:5;vector-effect:non-scaling-stroke}.ground-guide path{fill:none;stroke:#fff9;stroke-width:1;vector-effect:non-scaling-stroke}input{width:22px;height:22px}@media(max-width:1100px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){main{grid-template-columns:1fr}}
</style><header><h1>Coops · exact occupied tiles · straight artwork</h1><label><input type="checkbox" id="guides" checked>Grid outline</label><label><input type="checkbox" id="animals" checked>Live hens</label><label><input type="checkbox" id="fixed">Same tile scale</label></header><main></main>
<script src="rotations.js?v=6"></script><script src="directional-yards.js?v=2"></script><script src="rotation-assets.js?v=4"></script><script src="paddock-art-data.js?v=1"></script><script src="paddock-art.js?v=2"></script><script src="coop-art-data.js?v=2"></script><script src="coop-art.js?v=3"></script><script>
function draw(){const R=window.meadowRotations,C=window.meadowCoopArt,main=document.querySelector('main');main.innerHTML='';for(let tier=0;tier<4;tier++)for(let rotation=0;rotation<4;rotation++){
 const o={id:'review-'+tier+'-'+rotation,type:'coop',tier,rotation},[w,h]=window.meadowYards.baseSize(o),fp=R.rotatedFootprint({w,h},rotation),g=C.geometry(o,fp),project=p=>C.project(p,fp),points=g.corners.map(project).map(p=>p.join(',')).join(' ');let grid='';for(let x=1;x<fp.w;x++)grid+='<path d="M'+project({x,y:0}).join(' ')+'L'+project({x,y:fp.h}).join(' ')+'"/>';for(let y=1;y<fp.h;y++)grid+='<path d="M'+project({x:0,y}).join(' ')+'L'+project({x:fp.w,y}).join(' ')+'"/>';
 const article=document.createElement('article');article.innerHTML='<h2>Level '+(tier+1)+' · '+rotation*90+'° · '+fp.w+'×'+fp.h+' tiles · '+[1,3,5,7][tier]+' hens</h2><div class="scene"><div class="object">'+R.art(o,fp,{residents:document.querySelector('#animals').checked?Array.from({length:[1,3,5,7][tier]},()=>({type:'chicken',breedTier:0})):[]})+(document.querySelector('#guides').checked?'<svg class="ground-guide" viewBox="0 0 1000 1000" preserveAspectRatio="none">'+grid+'<polygon points="'+points+'"/></svg>':'')+'</div></div>';main.append(article);const scene=article.querySelector('.scene'),object=article.querySelector('.object'),width=document.querySelector('#fixed').checked?42*(w+h):Math.min(scene.clientWidth*.84,290);Object.assign(object.style,{width:width+'px',height:width/C.ratio+'px',left:(scene.clientWidth-width)/2+'px',top:'145px'});
}}
document.querySelectorAll('input').forEach(el=>el.onchange=draw);window.addEventListener('resize',draw);draw();
</script></html>
