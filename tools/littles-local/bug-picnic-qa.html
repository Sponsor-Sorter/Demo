s?v=2"><link rel="stylesheet" href="bug-smash.css?v=3"><link rel="stylesheet" href="bug-picnic.css?v=1"><style>body{padding:24px;background:#fff3d9;color:#365833}#qa-open,#qa-level{font:inherit;min-height:48px;padding:10px 18px}#qa-rounds,#qa-status{display:block;margin-top:18px}</style></head><body><h1>Bug Smash Picnic Patrol · local QA</h1><p>Memory-only development fixture. Existing browser progress and credits are never loaded or changed.</p><label for="qa-level">Starting picnic</label><select id="qa-level"><option value="1">1 · Captain Acorn</option><option value="2">2 · Bubble Boss</option><option value="3">3 · Tickle Tank</option><option value="10">10 · Harder Captain Acorn</option><option value="11">11 · Harder Bubble Boss</option><option value="12">12 · Harder Tickle Tank</option></select> <button id="qa-open" disabled>Open Rainbow Bug Smash</button><output id="qa-status">Preparing isolated memory storage…</output><output id="qa-rounds">Completed local rounds: 0</output><script>
(async()=>{
  const status=document.querySelector('#qa-status'),open=document.querySelector('#qa-open'),bag=new Map();
  const memory=Object.freeze({get length(){return bag.size;},key:i=>[...bag.keys()][i]??null,getItem:k=>bag.has(String(k))?bag.get(String(k)):null,setItem:(k,v)=>bag.set(String(k),String(v)),removeItem:k=>bag.delete(String(k)),clear:()=>bag.clear()});
  try{Object.defineProperty(window,'localStorage',{value:memory,writable:false,configurable:false});if(window.localStorage!==memory)throw Error('Memory adapter unavailable');}
  catch{status.textContent='Memory-only fixture unavailable. No game modules were loaded.';return;}
  window.meadowWeeklyFair={getQualityBuild:()=>99};
  const modules=['approved-voices.js?v=20','audio.js?v=46','play-access.js?v=3','celebration.js?v=2','bug-picnic-core.js?v=1','bug-picnic-paint.js?v=1','bug-picnic.js?v=1'];
  try{
    for(const src of modules)await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(Error('Fixture module unavailable: '+src));document.head.append(script);});
    let rounds=0;window.meadowBugPicnic.attach({level:()=>Number(document.querySelector('#qa-level').value),completed:()=>{if(window.meadowLittlesAccess.complete('bug_smash')===false)return false;document.querySelector('#qa-rounds').textContent='Completed local rounds: '+(++rounds);return true;}});
    open.onclick=()=>window.meadowBugPicnic.open();open.disabled=false;status.textContent='Memory-only storage ready. No production services connected.';
  }catch(error){status.textContent=error.message;}
})();
</script></body></html>
