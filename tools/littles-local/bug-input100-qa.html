<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated Bug Smash input checks</title><style>html,body{margin:0;height:100%;background:#fff7df}iframe{border:0;width:100%;height:100%}output{position:fixed;bottom:0;left:0;max-width:100%;background:white;font:12px monospace;z-index:3}</style><iframe id="game" src="/qa/bug-picnic"></iframe><output id="qa-input-results">Running isolated DOM input scenarios…</output><script>
(async()=>{
 const frame=document.querySelector('#game'),results=[],out=document.querySelector('#qa-input-results');let w,d,g;
 const delay=ms=>new Promise(r=>setTimeout(r,ms)),assert=(value,message)=>{if(!value)throw Error(message);};
 const until=async(fn,message)=>{for(let i=0;i<400;i++){if(fn())return;await delay(25);}throw Error(message);};
 await until(()=>frame.contentDocument?.querySelector('#qa-open')?.disabled===false,'Memory fixture did not become ready');w=frame.contentWindow;d=w.document;
 // These are explicit in-memory scenario arrangements, never production saves or a full-round test.
 const RealGame=w.meadowBugPicnicCore.Game;w.meadowBugPicnicCore.Game=class extends RealGame{constructor(...args){super(...args);g=this;}};
 const click=(node,detail=1,pointerId)=>{const event=pointerId===undefined?new w.MouseEvent('click',{bubbles:true,cancelable:true,detail}):new w.PointerEvent('click',{bubbles:true,cancelable:true,detail,pointerId,pointerType:'touch'});node.dispatchEvent(event);};
 const pointer=(node,type,id,x,y)=>{const b=node.getBoundingClientRect();node.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,button:0,pointerId:id,pointerType:'touch',clientX:x??(b.left+b.width/2),clientY:y??(b.top+b.height/2)}));};
 const paint=()=>new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));
 const advance=()=>{for(let i=0;i<4;i++)g.step(.05);};
 const check=async(name,fn)=>{await fn();results.push({name,pass:true});};
 const open=async()=>{d.querySelector('#qa-open').click();await until(()=>d.querySelector('[data-bsm-start]')?.disabled===false,'Start did not become ready');d.querySelector('[data-bsm-start]').click();await paint();};
 const seed=async(count=1)=>{g.ants=[];g.boss=null;g.phase='ants';g.done=false;g.paused=false;g.spawnIn=999;for(let i=0;i<count;i++){assert(g.spawn(),'Fixture could not create an ant');const a=g.ants.at(-1);Object.assign(a,{x:g.width*(.3+i*.4),y:g.height*.4,angle:Math.PI/2,speed:0,armoured:true,hp:2,maxHp:2,r:g.radius*1.2,returning:false});}g.spawnIn=999;advance();await paint();return[...d.querySelectorAll('.bsm-ant-key')];};
 await open();
 await check('standalone accessibility click detail 1',async()=>{const [n]=await seed();click(n,1);assert(g.ants[0].hp===1,'Accessibility detail1 did not remove exactly one armour hit');});
 await check('keyboard activation detail 0',async()=>{const [n]=await seed();click(n,0);assert(g.ants[0].hp===1,'Keyboard activation did not remove exactly one armour hit');});
 await check('pointerdown plus compatibility click is one hit',async()=>{const [n]=await seed(),before=g.taps;pointer(n,'pointerdown',21);pointer(n,'pointerup',21);click(n,1,21);assert(g.ants[0].hp===1&&g.taps===before+1,'One pointer gesture invoked gameplay twice');await delay(0);});
 await check('missed pointerdown allows semantic fallback',async()=>{const [n]=await seed();const b=n.getBoundingClientRect();pointer(n,'pointerdown',22,b.left+1,b.top+1);assert(g.ants[0].hp===2,'Fixture corner unexpectedly hit the ellipse');pointer(n,'pointerup',22,b.left+1,b.top+1);click(n,1,22);assert(g.ants[0].hp===1,'A missed down incorrectly suppressed activation');await delay(0);});
 await check('independent repeated activations',async()=>{const [n]=await seed();click(n,1);advance();click(n,1);assert(g.ants.length===0,'Independent clicks were suppressed or double-counted');});
 await check('two pointer IDs remain independent',async()=>{const [a,b]=await seed(2),before=g.taps;pointer(a,'pointerdown',31);pointer(b,'pointerdown',32);pointer(a,'pointerup',31);click(a,1,31);pointer(b,'pointerup',32);click(b,1,32);assert(g.ants.length===2&&g.ants.every(n=>n.hp===1)&&g.taps===before+2,'Multitouch did not invoke gameplay once per pointer');await delay(0);});
 await check('boss part has no duplicate hidden by a cooldown',async()=>{g.ants=[];g.boss=null;g.phase='ants';g.beginBoss();for(let i=0;i<40;i++)g.step(.05);g.boss.parts=[2,2,2];g.boss.maxPartHp=2;await paint();const n=d.querySelector('[aria-label^="Shiny acorn clasp 1"]');assert(n,'Clasp fixture missing');pointer(n,'pointerdown',35);pointer(n,'pointerup',35);click(n,1,35);assert(g.boss.parts[0]===1,'One gesture removed two clasp hits');await delay(0);});
 await check('cancelled gesture retires its suppression',async()=>{const [n]=await seed();pointer(n,'pointerdown',41);pointer(n,'pointercancel',41);await delay(0);advance();click(n,1);assert(g.ants.length===0,'Cancelled pointer left stale suppression');});
 await check('lost capture retires its suppression',async()=>{const [n]=await seed();pointer(n,'pointerdown',42);pointer(n,'lostpointercapture',42);await delay(0);advance();click(n,1);assert(g.ants.length===0,'Lost capture left stale suppression');});
 await check('pause clears an unfinished pointer sequence',async()=>{const [n]=await seed();pointer(n,'pointerdown',43);d.querySelector('[data-bsm-pause]').click();d.querySelector('[data-bsm-resume]').click();advance();click(n,1);assert(g.ants.length===0,'Pause retained stale suppression');});
 await check('detached controls cannot act in another session',async()=>{const [old]=await seed(),prior=g;d.querySelector('[data-bsm-close]').click();await open();const [current]=await seed();click(old,1);assert(prior.ants[0].hp===2&&g.ants[0].hp===2&&current.isConnected,'Detached control acted after reopening');});
 const prepareWin=async id=>{g.ants=[];g.boss=null;g.phase='ants';g.beginBoss();for(let i=0;i<40;i++)g.step(.05);g.boss.parts=[0,0,0];g.openShell();g.boss.hp=1;await paint();const n=d.querySelector('[aria-label*="tummy"][aria-label*="1 taps left"]');assert(n,'Final boss control missing');pointer(n,'pointerdown',id);await until(()=>d.querySelector('.bsm-win'),'Win did not appear');return n;};
 await check('finishing pointer cannot activate Next',async()=>{await prepareWin(51);const before=g,next=d.querySelector('[data-bsm-next]');pointer(next,'pointerup',51);click(next,1,51);assert(d.querySelector('.bsm-win')&&g===before,'Finishing gesture started another round');await delay(0);});
 await check('standalone accessibility activation can play next',async()=>{const prior=g;click(d.querySelector('[data-bsm-next]'),1);await paint();assert(g!==prior&&!d.querySelector('.bsm-win'),'Accessibility Next was blocked');});
 await check('standalone accessibility activation can leave win',async()=>{await prepareWin(52);pointer(d.querySelector('[data-bsm-done]'),'pointerup',52);await delay(0);click(d.querySelector('[data-bsm-done]'),1);assert(!d.querySelector('.bsm-dialog').open,'Accessibility No thanks was blocked');});
 out.textContent=JSON.stringify({complete:true,pass:true,scenarioOnly:true,phoneTest:false,cases:results});document.title='PASS · Bug Smash input checks';
})().catch(error=>{document.querySelector('#qa-input-results').textContent=JSON.stringify({complete:true,pass:false,error:error.message,stack:error.stack});document.title='FAIL · Bug Smash input checks';});
</script></html>
