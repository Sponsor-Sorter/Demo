<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Writing101 local QA</title><!-- LITTLES_QA_STYLES --><style>body{margin:0;font:18px system-ui;background:#e4f0d8}#qa-controls{padding:20px;display:flex;gap:12px;flex-wrap:wrap}#qa-controls button{padding:15px;font:inherit}#qa-results{white-space:pre-wrap}button{cursor:pointer}</style>
