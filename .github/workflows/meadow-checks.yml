name: Meadow Markets regression checks
on:
  push:
    paths: ['meadow-and-market/**', 'scripts/check-meadow*', 'tools/build-meadow-server-rules.cjs', 'tools/meadow-android/**', 'tools/meadow-email/**', 'assets/email/**', 'supabase/functions/_shared/meadow-*', 'supabase/functions/meadow-market-*/**', 'supabase/meadow-*.sql', 'supabase/migrations/**', '.github/workflows/meadow-checks.yml']
  pull_request:
    paths: ['meadow-and-market/**', 'scripts/check-meadow*', 'tools/build-meadow-server-rules.cjs', 'tools/meadow-android/**', 'tools/meadow-email/**', 'assets/email/**', 'supabase/functions/_shared/meadow-*', 'supabase/functions/meadow-market-*/**', 'supabase/meadow-*.sql', 'supabase/migrations/**', '.github/workflows/meadow-checks.yml']
jobs:
  game-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env scripts/check-meadow-recovery184.ts
      - run: deno test --no-config --node-modules-dir=none scripts/check-meadow-store194.ts
      - run: deno test --no-config scripts/check-meadow-notifications203.ts
      - run: node tools/build-meadow-server-rules.cjs --check
      - run: deno test --no-config scripts/check-meadow-actions204.ts scripts/check-meadow-gateway204.ts scripts/check-meadow-progression205.ts scripts/check-meadow-workers205.ts scripts/check-meadow-help206.ts scripts/check-meadow-market207.ts scripts/check-meadow-trips208.ts scripts/check-meadow-lessons209.ts
      - run: node scripts/check-meadow-command-client205.cjs
      - run: node scripts/check-meadow-command-ui210.cjs
      - run: node scripts/check-meadow-worker-motion210.cjs
      - run: node scripts/check-meadow-trip-ui210.cjs
      - run: node scripts/check-meadow-refund204.cjs
      - run: deno check --no-config supabase/functions/meadow-market-farm-actions/index.ts
      - run: deno test --no-config --allow-env scripts/check-meadow-cleanup202.ts
      - run: deno check --no-config --node-modules-dir=none supabase/functions/meadow-market-store/index.ts supabase/functions/meadow-market-ad-reward/index.ts supabase/functions/meadow-market-play-notifications/index.ts
      - run: deno check --no-config supabase/functions/meadow-market-account-cleanup/index.ts
      - run: node scripts/check-meadow.cjs
      - run: node scripts/check-meadow-versions.cjs --committed
  android-build:
    needs: game-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/meadow-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/meadow-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run android:debug
      - run: npm run android:play
