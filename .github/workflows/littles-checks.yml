name: Meadow Market Littles checks
on:
  push:
    paths: ['meadow-market-littles/**', 'scripts/check-littles*.cjs', 'tools/meadow-littles-android/**', '.github/workflows/littles-checks.yml']
  pull_request:
    paths: ['meadow-market-littles/**', 'scripts/check-littles*.cjs', 'tools/meadow-littles-android/**', '.github/workflows/littles-checks.yml']
jobs:
  game-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-littles.cjs
  android-build:
    needs: game-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/meadow-littles-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/meadow-littles-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run android:debug
