name: Meadow Market Littles checks
on:
  push:
    paths: ['meadow-market-littles/**', 'scripts/check-littles*.cjs', 'tools/littles-local/**', 'tools/meadow-littles-android/**', 'supabase/functions/littles-play-*/**', 'supabase/functions/littles-ad-round*/**', 'supabase/functions/meadow-littles-fairplay/**', 'supabase/functions/_shared/littles-security95*', 'supabase/functions/_shared/fairplay-security-contract-v1.mjs', 'tools/littles-cloud-security95.test.cjs', 'tools/littles-rewarded-tests/**', 'supabase/migrations/*littles*', 'deno.lock', '.github/workflows/littles-checks.yml']
  pull_request:
    paths: ['meadow-market-littles/**', 'scripts/check-littles*.cjs', 'tools/littles-local/**', 'tools/meadow-littles-android/**', 'supabase/functions/littles-play-*/**', 'supabase/functions/littles-ad-round*/**', 'supabase/functions/meadow-littles-fairplay/**', 'supabase/functions/_shared/littles-security95*', 'supabase/functions/_shared/fairplay-security-contract-v1.mjs', 'tools/littles-cloud-security95.test.cjs', 'tools/littles-rewarded-tests/**', 'supabase/migrations/*littles*', 'deno.lock', '.github/workflows/littles-checks.yml']
permissions:
  contents: read
jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /deno.lock
            /supabase/
            /tools/littles-cloud-security95.test.cjs
            /meadow-market-littles/littles-cloud.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify frozen central evidence contract
        run: node -e "require('node:assert/strict').equal(require('node:crypto').createHash('sha256').update(require('node:fs').readFileSync('supabase/functions/_shared/fairplay-security-contract-v1.mjs')).digest('hex'),'6571d640574024bbd40af8b1e3ce6a69b57ab1b3b3be2e2bffa3c136427e821f')"
      - name: Exercise unchanged client retries and explicit save choices
        run: node tools/littles-cloud-security95.test.cjs
      - name: Exercise authenticated save evidence and ordinary restore exclusions
        run: deno test --node-modules-dir=none --frozen --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_PUBLISHABLE_KEY,SUPABASE_SERVICE_ROLE_KEY,GOOGLE_PLAY_SERVICE_ACCOUNT --deny-net supabase/functions/_shared/littles-security95_test.ts supabase/functions/meadow-littles-fairplay/security95_test.ts supabase/functions/littles-play-store/security95_test.ts supabase/functions/littles-play-store/service_test.ts supabase/functions/littles-play-store/rules_test.ts supabase/functions/meadow-littles-fairplay/contracts_test.ts
      - name: Typecheck both backend entrypoints
        run: deno check --node-modules-dir=none --frozen supabase/functions/meadow-littles-fairplay/index.ts supabase/functions/littles-play-store/index.ts
  billing-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,GOOGLE_PLAY_SERVICE_ACCOUNT supabase/functions/littles-play-store/rules_test.ts supabase/functions/littles-play-store/provider-diagnostics_test.ts supabase/functions/littles-play-store/service_test.ts
      - run: deno test supabase/functions/littles-ad-round-reward/verify_test.ts
      - run: deno check supabase/functions/littles-play-store/index.ts supabase/functions/littles-play-notifications/index.ts supabase/functions/littles-ad-rounds/index.ts supabase/functions/littles-ad-round-reward/index.ts
  game-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA cannot reach production authentication
        run: node scripts/check-littles-qa-network.cjs
      - run: node scripts/check-littles.cjs
      - name: Check real browser Bug Smash input gestures
        run: node scripts/check-littles-bug-input-browser.cjs
      - name: Check writing strokes and full rounds with real browser touches
        run: node --require ./tools/littles-local/qa-network.cjs scripts/check-littles-writing-browser.cjs
        env:
          WRITING_QA_OUTPUT: ${{ runner.temp }}/littles-writing101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing101-touch-layout
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/littles-writing101/*.png
            ${{ runner.temp }}/littles-writing101/result.json
            ${{ runner.temp }}/littles-writing101/failure.txt
      - run: node --require ./tools/littles-local/qa-network.cjs scripts/check-littles-ad-readiness.cjs
      - run: node --require ./tools/littles-local/qa-network.cjs --test scripts/check-littles-rewarded-rounds.cjs scripts/check-littles-rewarded-adapter.cjs scripts/check-littles-rewarded-transport.cjs
      - run: npm ci --ignore-scripts --prefix tools/littles-rewarded-tests
      - run: npm test --prefix tools/littles-rewarded-tests
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/littles-local/qa-network.cjs
      - name: Check actual native-version admission SQL
        run: node --require ./tools/littles-local/qa-network.cjs scripts/check-littles-ad-native97-sql.cjs
  android-build:
    needs: game-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/meadow-littles-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/meadow-littles-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Check native consent success and error callbacks
        run: node scripts/check-ad-consent-callbacks.cjs
      - name: Check actual reward callbacks and diagnostic trace
        run: node scripts/check-ad-reward-callbacks.cjs
      - run: npm run android:debug
      - name: Check compiled production-flavor launcher
        env:
          LITTLES_ADMOB_APP_ID: ca-app-pub-6946008351204848~9683786343
          LITTLES_BANNER_AD_UNIT: ca-app-pub-6946008351204848/8881665550
          LITTLES_REWARDED_AD_UNIT: ca-app-pub-6946008351204848/6193791997
        run: node scripts/build-android.cjs assemblePlayDebug
      - run: node scripts/build-android.cjs testAcceptanceDebugUnitTest
      - name: Lint production release
        env:
          LITTLES_ADMOB_APP_ID: ca-app-pub-6946008351204848~9683786343
          LITTLES_BANNER_AD_UNIT: ca-app-pub-6946008351204848/8881665550
          LITTLES_REWARDED_AD_UNIT: ca-app-pub-6946008351204848/6193791997
        run: node scripts/build-android.cjs lintPlayRelease
