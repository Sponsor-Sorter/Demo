name: Meadow Market Littles checks
on:
  push:
    paths: ['meadow-market-littles/**', 'scripts/check-littles*.cjs', 'tools/meadow-littles-android/**', 'supabase/functions/littles-play-*/**', 'supabase/migrations/*littles*', '.github/workflows/littles-checks.yml']
  pull_request:
    paths: ['meadow-market-littles/**', 'scripts/check-littles*.cjs', 'tools/meadow-littles-android/**', 'supabase/functions/littles-play-*/**', 'supabase/migrations/*littles*', '.github/workflows/littles-checks.yml']
jobs:
  billing-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,GOOGLE_PLAY_SERVICE_ACCOUNT supabase/functions/littles-play-store/rules_test.ts supabase/functions/littles-play-store/provider-diagnostics_test.ts supabase/functions/littles-play-store/service_test.ts
      - run: deno check supabase/functions/littles-play-store/index.ts supabase/functions/littles-play-notifications/index.ts
  game-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-littles.cjs
  android-build:
    needs: game-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/meadow-littles-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/meadow-littles-android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run android:debug
      - run: node scripts/build-android.cjs testAcceptanceDebugUnitTest
      - name: Lint production release
        env:
          LITTLES_ADMOB_APP_ID: ca-app-pub-6946008351204848~9683786343
          LITTLES_BANNER_AD_UNIT: ca-app-pub-6946008351204848/8881665550
        run: node scripts/build-android.cjs lintPlayRelease
